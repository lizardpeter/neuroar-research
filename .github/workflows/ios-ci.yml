name: iOS simulator build and geometry tests

# Manual validation only. Publishing is separately manual in testflight.yml.
# Prevent two macOS jobs per source commit and long auto-queued backlogs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout (no patient data belongs in this repository)
        uses: actions/checkout@v4

      - name: Check repository for accidentally included sensitive files
        run: bash scripts/check-public-repo.sh

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Display toolchain
        run: xcodebuild -version && swift --version

      - name: Install native Rust toolchain for iOS builds
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Test Rust core
        run: cargo test --manifest-path RustCore/Cargo.toml --locked

      - name: Check App Store Connect preflight script syntax
        run: node --check scripts/check-appstore-setup.mjs

      - name: Test cross-platform MRI geometry and importers
        run: swift test --package-path GeometryCore

      - name: Generate deterministic app icon assets
        run: python3 scripts/generate-app-icon.py

      - name: Validate generated icon metadata
        run: python3 -m json.tool NeuroAR/Assets.xcassets/AppIcon.appiconset/Contents.json >/dev/null

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project NeuroARResearch.xcodeproj -scheme NeuroARResearch

      - name: Compile unsigned iOS simulator application
        run: |
          set -euo pipefail
          xcodebuild \
            -project NeuroARResearch.xcodeproj \
            -scheme NeuroARResearch \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/ios-simulator-build.log"

      - name: Archive unsigned iPhone application for distribution-metadata validation
        run: |
          set -euo pipefail
          xcodebuild \
            -project NeuroARResearch.xcodeproj \
            -scheme NeuroARResearch \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath .build/CI-NeuroARResearch.xcarchive \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            archive | tee "$RUNNER_TEMP/ios-device-archive.log"

      - name: Validate archived iPhone app metadata
        run: python3 scripts/validate-ios-bundle.py .build/CI-NeuroARResearch.xcarchive/Products/Applications/NeuroARResearch.app com.pg.neuroar.research

      - name: Attach build log if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build-log
          path: |
            ${{ runner.temp }}/ios-simulator-build.log
            ${{ runner.temp }}/ios-device-archive.log
          if-no-files-found: ignore
