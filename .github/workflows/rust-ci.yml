name: Rust core tests and iOS cross-compilation

# Manual validation only. Publishing is separately manual in testflight.yml.
# Prevent two macOS jobs per source commit and long auto-queued backlogs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Unit tests
        run: cargo test --manifest-path RustCore/Cargo.toml
      - name: Compile device and simulator static libraries
        run: |
          cargo build --manifest-path RustCore/Cargo.toml --release --target aarch64-apple-ios
          cargo build --manifest-path RustCore/Cargo.toml --release --target aarch64-apple-ios-sim
      - name: Verify libraries were produced
        run: |
          test -s RustCore/target/aarch64-apple-ios/release/libneuroar_core.a
          test -s RustCore/target/aarch64-apple-ios-sim/release/libneuroar_core.a
