name: Manually publish NeuroAR to TestFlight

# Secure automatic cloud signing. No local Xcode, CSR, .p12 or manually
# uploaded provisioning profile is required for this attempt.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroar-testflight-release
  cancel-in-progress: false

jobs:
  archive-and-upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight
    env:
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_BUNDLE_ID: ${{ vars.APPSTORE_BUNDLE_ID || 'com.pg.neuroar.research' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

    steps:
      - name: Checkout protected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check public source for sensitive files
        run: bash scripts/check-public-repo.sh

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Validate configuration and protect temporary API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPSTORE_ISSUER_ID APPSTORE_API_KEY_ID APPSTORE_BUNDLE_ID APPLE_TEAM_ID ASC_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name. See TESTFLIGHT_SETUP.md. No Apple certificates or .p12 are required for this workflow."
              exit 1
            fi
          done
          if [[ "$APPSTORE_BUNDLE_ID" != "com.pg.neuroar.research" ]]; then
            echo "::error::APPSTORE_BUNDLE_ID is not com.pg.neuroar.research. Update or delete the outdated testflight environment variable."
            exit 1
          fi
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be the 10-character Apple Developer Team ID."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/neuroar-private"
          key_path="$RUNNER_TEMP/neuroar-private/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          if ! grep -q -- 'BEGIN PRIVATE KEY' "$key_path"; then
            echo "::error::APPSTORE_API_PRIVATE_KEY must contain the full .p8 file, including its header and footer."
            exit 1
          fi
          echo "ASC_AUTH_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "App Store Connect credentials are present; key contents will not be printed."

      - name: Confirm app record exists in App Store Connect
        run: node scripts/check-appstore-setup.mjs

      - name: Install Rust for iOS
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned master commit
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Test Rust geometry
        run: cargo test --manifest-path RustCore/Cargo.toml --locked

      - name: Test Swift imaging and registration
        run: swift test --package-path GeometryCore

      - name: Generate app icon assets
        run: python3 scripts/generate-app-icon.py

      - name: Archive without local signing identity
        run: |
          set -euo pipefail
          mkdir -p .build
          xcodebuild \
            -project NeuroARResearch.xcodeproj \
            -scheme NeuroARResearch \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath .build/NeuroARResearch.xcarchive \
            -derivedDataPath .build/DerivedData \
            "PRODUCT_BUNDLE_IDENTIFIER=$APPSTORE_BUNDLE_ID" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            archive

      - name: Validate release archive metadata before Apple upload
        run: python3 scripts/validate-ios-bundle.py .build/NeuroARResearch.xcarchive/Products/Applications/NeuroARResearch.app "$APPSTORE_BUNDLE_ID"

      - name: Prepare automatic cloud-signing export options
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "app-store-connect",
              "destination": "upload",
              "signingStyle": "automatic",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "manageAppVersionAndBuildNumber": False,
              "stripSwiftSymbols": True,
              "uploadSymbols": True,
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "NeuroARExportOptions.plist")
          with open(path, "wb") as out:
              plistlib.dump(options, out)
          print("Configured automatic cloud signing and direct App Store Connect upload.")
          PY

      - name: Cloud-sign and upload directly to TestFlight
        run: |
          set -euo pipefail
          mkdir -p .build/Export
          xcodebuild \
            -exportArchive \
            -archivePath .build/NeuroARResearch.xcarchive \
            -exportPath .build/Export \
            -exportOptionsPlist "$RUNNER_TEMP/NeuroARExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          echo "Xcode export/upload finished. Confirm processing and internal TestFlight availability in App Store Connect."

      - name: Delete temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/neuroar-private/AuthKey.p8"
          rm -f "$RUNNER_TEMP/NeuroARExportOptions.plist"

      # Intentionally no upload-artifact step. A signed app, .p8, certificate,
      # provisioning profile, or export log must never be published by public CI.
