name: NeuroARResearch
options:
  bundleIdPrefix: org.neuroar.research
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
packages:
  GeometryCore:
    path: GeometryCore
targets:
  NeuroARResearch:
    type: application
    platform: iOS
    sources:
      - path: NeuroAR
    dependencies:
      - package: GeometryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pg.neuroar.research
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LIBRARY_SEARCH_PATHS:
          - '$(inherited)'
          - '$(PROJECT_DIR)/.build/rust/$(PLATFORM_NAME)'
        OTHER_LDFLAGS:
          - '$(inherited)'
          - '-lneuroar_core' 
        INFOPLIST_KEY_NSCameraUsageDescription: 'Camera and LiDAR depth are used for research-only 3D surface capture and AR overlay.'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SWIFT_EMIT_LOC_STRINGS: YES
    preBuildScripts:
      - name: Build native RustCore static library
        script: 'bash "${PROJECT_DIR}/scripts/build-rust-ios.sh"'
        basedOnDependencyAnalysis: false
